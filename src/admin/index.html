<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>研究管理后台 | 心理弹性训练</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <main class="admin-shell">
        <header class="topbar">
            <a class="brand" href="../index.html">心理弹性训练 <span>研究管理</span></a>
            <div id="staffBar" class="staff-bar" hidden>
                <span id="staffName"></span>
                <button id="logoutButton" class="button button-secondary" type="button">退出</button>
            </div>
        </header>

        <section id="loginView" class="login-view" hidden>
            <form id="loginForm" class="login-form">
                <h1>工作人员登录</h1>
                <label for="username">账号</label>
                <input id="username" name="username" autocomplete="username" required maxlength="100">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
                <p id="loginError" class="error-message" role="alert"></p>
                <button class="button button-primary" type="submit">登录后台</button>
            </form>
        </section>

        <section id="dashboardView" hidden>
            <div class="page-heading">
                <div><h1>研究进度</h1><p id="updatedAt">正在加载</p></div>
                <button id="refreshButton" class="button button-secondary" type="button">刷新数据</button>
            </div>
            <div id="overviewGrid" class="overview-grid" aria-live="polite"></div>

            <section class="participants-section" aria-labelledby="participantsTitle">
                <div class="section-heading"><h2 id="participantsTitle">参与者</h2><span id="resultCount"></span></div>
                <form id="filters" class="filters">
                    <label class="search-field"><span>搜索</span><input id="searchInput" type="search" placeholder="编号或姓名"></label>
                    <label><span>状态</span><select id="statusFilter"><option value="all">全部</option><option value="active">进行中</option><option value="paused">已暂停</option><option value="archived">已退出</option></select></label>
                    <label><span>排序</span><select id="sortFilter"><option value="alert">提醒优先</option><option value="recent">最近完成</option><option value="progress">训练进度</option><option value="code">研究编号</option></select></label>
                    <label><span>训练状态</span><select id="completionFilter"><option value="all">全部</option><option value="enrolled">已入组</option><option value="today">今日已完成</option><option value="graduated">已结业</option><option value="incomplete">未结业</option></select></label>
                    <label class="check-filter"><input id="alertFilter" type="checkbox"><span>仅看连续未完成提醒</span></label>
                    <button class="button button-secondary" type="submit">筛选</button>
                </form>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>研究编号</th><th>姓名</th><th>状态</th><th>入组日期</th><th>完成进度</th><th>最近完成</th><th>最近练习时长</th><th>提醒</th></tr></thead>
                        <tbody id="participantRows"><tr><td colspan="8" class="empty-state">登录后加载参与者</td></tr></tbody>
                    </table>
                </div>
                <div class="table-footer"><span id="pageLabel"></span><div><button id="previousPage" class="button button-secondary" type="button">上一页</button><button id="nextPage" class="button button-secondary" type="button">下一页</button></div></div>
            </section>
        </section>
    </main>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="participantDrawer" class="participant-drawer" aria-labelledby="drawerTitle" aria-modal="true" role="dialog" hidden>
        <div class="drawer-heading"><div><p>参与者详情</p><h2 id="drawerTitle"></h2></div><button id="closeDrawer" class="icon-button" type="button" aria-label="关闭详情">×</button></div>
        <div id="drawerContent" class="drawer-content"></div>
    </aside>

    <div id="globalMessage" class="global-message" role="status" aria-live="polite"></div>
    <script src="../runtime-config.js"></script>
    <script type="module" src="../js/admin.js"></script>
</body>
</html>
